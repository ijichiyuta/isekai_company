name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # nightly (JST 3:00) — 10k lives statistics

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # x64 + ARM64: AC-02 cross-arch
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Forbidden token check (requirements §2.2)
        run: bash tool/check_forbidden.sh
      - name: Pub get
        run: |
          dart pub get --directory=packages/core
          dart pub get --directory=packages/headless
      - name: Analyze
        run: |
          dart analyze packages/core
          dart analyze packages/headless
      - name: Unit tests
        run: |
          (cd packages/core && dart test)
          (cd packages/headless && dart test)
      - name: Replay determinism + 200-life smoke (AC-01/02/03)
        run: |
          cd packages/headless
          dart run bin/run.dart --balance ../../assets/balance \
            --lives 200 --seed 1 --verify-replay
      - name: Final hashes for cross-arch comparison
        run: |
          cd packages/headless
          dart run bin/run.dart --balance ../../assets/balance \
            --lives 5 --seed 777 --hash-only > hashes-${{ matrix.os }}.txt
          cat hashes-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: packages/headless/hashes-*.txt

  flutter-app:
    name: flutter app (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Balance copies in sync (app bundle vs canonical)
        run: diff -r assets/balance app/assets/balance
      - name: Pub get
        run: |
          dart pub get --directory=packages/core
          flutter pub get --directory=app
      - name: Analyze app
        run: flutter analyze app
      - name: App tests
        run: cd app && flutter test

  balance-gate:
    name: balance gate (AC-04/07 hard, others soft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: |
          dart pub get --directory=packages/core
          dart pub get --directory=packages/headless
      - name: Run balance gate (hard gates block, soft gates report)
        run: |
          cd packages/headless
          dart run bin/run.dart --balance ../../assets/balance --gate --lives 200 --seed 1

  asset-audit:
    name: AC-17 asset pipeline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Pub get
        run: dart pub get --directory=tool/asset_pipeline
      - name: Sample pipeline produces conformant art
        run: |
          cd tool/asset_pipeline
          dart analyze
          dart run bin/gen_samples.dart ../../assets/generated
      - name: Audit all generated assets against the fixed palette
        run: |
          cd tool/asset_pipeline
          dart run bin/audit.dart ../../assets/generated 32 ../../assets/palette.json

  ac14-debug-excluded:
    name: AC-14 debug menu excluded from release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub get --directory=packages/core
      - run: flutter pub get --directory=app
      - name: Build release
        run: cd app && flutter build macos --release
      - name: Assert debug menu is tree-shaken out of the release binary
        run: |
          BIN=$(find app/build/macos -path '*App.framework*/Versions/A/App' | head -1)
          echo "release binary: $BIN"
          test -n "$BIN" || { echo "release binary not found"; exit 1; }
          # Sanity: a reachable symbol should be present (informational).
          if strings "$BIN" | grep -q "InventionOverlay"; then
            echo "sanity OK: reachable symbol present"
          else
            echo "note: reachable symbols not found (AOT may strip names)"
          fi
          # Hard gate: debug-only symbols must be absent.
          if strings "$BIN" | grep -E "DebugMenu|debugGrant|debugStep"; then
            echo "FAIL: debug menu symbols present in release build (AC-14)"
            exit 1
          fi
          echo "OK: no debug menu symbols in release (AC-14 satisfied)"

  cross-arch:
    name: cross-arch hash compare (AC-02)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: false
      - name: Compare
        run: |
          diff hashes-ubuntu-latest/hashes-ubuntu-latest.txt \
               hashes-macos-latest/hashes-macos-latest.txt
          echo "cross-arch determinism: OK"

  nightly-10k:
    name: nightly 10k lives
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get --directory=packages/core && dart pub get --directory=packages/headless
      - name: 10,000 lives statistics
        run: |
          cd packages/headless
          dart run bin/run.dart --balance ../../assets/balance \
            --lives 10000 --seed 1 --csv nightly.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-10k-csv
          path: packages/headless/nightly.csv
